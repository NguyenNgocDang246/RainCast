# The collector machine: radar data for backtesting goes to data/tiles and
# to a local PostgreSQL. The web app and API run on Vercel and need neither.
#   cp .env.example .env
#   docker compose up -d
# Score the collected data (writes data/backtest.json for the admin page):
#   docker compose run --rm --entrypoint backtest collect
# The admin page runs locally: go run ./cmd/raincast (uses db and redis
# through .env), then npm run dev in web/, and open
# http://localhost:3000/admin.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: raincast
      POSTGRES_PASSWORD: raincast
      POSTGRES_DB: raincast
    # Only this machine reaches it (cmd/raincast on the host).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - raincast-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raincast"]
      interval: 5s
      retries: 10

  # Forecast cache for the local cmd/raincast (REDIS_URL in .env), as Upstash
  # is on Vercel. Only a cache: nothing is persisted.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"

  collect:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # The db service, not the host's localhost in .env.
      DATABASE_URL: postgres://raincast:raincast@db:5432/raincast?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    # A second fence behind the built-in guard (-max-cpu, -max-memory-mb…),
    # so a laptop stays usable while collecting.
    cpus: "2"
    mem_limit: 2g
    volumes:
      - raincast-data:/app/data

volumes:
  raincast-db:
  raincast-data:
