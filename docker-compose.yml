# Deploy everything on one server:
#   cp .env.example .env   # fill in GEOAPIFY_KEY, SITE_ADDRESS, ADMIN_*
#   docker compose up -d --build
# Only Caddy is reachable from outside (ports 80/443).
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - raincast-data:/app/data
      - geoip-data:/app/geoip:ro

  # Keeps DB-IP's free IP-to-country database (CC BY 4.0, no account; a new
  # one each month) fresh. It names the user's country for address search.
  # Written to a temp file and renamed, so the api never reads half a file.
  geoip:
    image: alpine:3
    restart: unless-stopped
    volumes:
      - geoip-data:/geoip
    command:
      - sh
      - -c
      - |
        while :; do
          if [ ! -s /geoip/country.mmdb ] || [ -n "$$(find /geoip/country.mmdb -mtime +7)" ]; then
            m=$$(date -u +%Y-%m)
            wget -qO- "https://download.db-ip.com/free/dbip-country-lite-$$m.mmdb.gz" | gunzip > /geoip/country.tmp \
              && [ -s /geoip/country.tmp ] && mv /geoip/country.tmp /geoip/country.mmdb && echo "updated $$m" \
              || { rm -f /geoip/country.tmp; echo "download failed"; }
          fi
          sleep 86400
        done

  # Collects radar data for backtesting, apart from the web app. Off by
  # default: docker compose --profile collect up -d. Score the data with
  #   docker compose run --rm --entrypoint backtest api   (writes the admin page's report)
  collect:
    build: .
    profiles: [collect]
    restart: unless-stopped
    entrypoint: ["collect"]
    # A second fence behind the built-in guard (-max-cpu, -max-memory-mb…),
    # so a laptop stays usable while collecting.
    cpus: "2"
    mem_limit: 2g
    volumes:
      - raincast-data:/app/data

  web:
    build: ./web
    restart: unless-stopped
    depends_on: [api]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, web]

volumes:
  raincast-data:
  geoip-data:
  caddy-data:
  caddy-config:
